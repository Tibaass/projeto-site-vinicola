<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinícola Agnello</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/efeitos.css">
    <link rel="shortcut icon" href="src/assets/imgs/favicon.ico" type="image/x-icon">
</head>

<body>
    <header class="header-login">
        <img src="src/assets/imgs/android-chrome-512x512.png" alt="Logo da Vinícola Agnello">
    </header>

    <main>
        <div class="login-container">
            
            <form action="src/pages/inicio.html" method="GET">
                <h1 >Realize seu login</h1>
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>

                <input id="login-btn" type="submit" value="Login">
            </form>
        </div>
    </main>

    <footer>
        © Vinhateria Agnello. Todos os direitos reservados. <br>
        Desenvolvido por <a href="https://www.linkedin.com/in/gustavo-arakaki-b9680b330" target="_blank">Gustavo Suzuki</a>, <a href="https://www.linkedin.com/in/pedro-henrique-pereira-da-costa-9457a8263/" target="_blank">Pedro Henrique Pereira</a>, <a href="https://www.linkedin.com/in/tiago-ferreira-65886134b/" target="_blank">Tiago Ferreira</a>
    </footer>
</body>

</html>
