<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve seu Vinho</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" href="../assets/imgs/favicon.ico" type="image/x-icon">
</head>

<body>
    <header>
        <img src="../assets/imgs/android-chrome-512x512.png" alt="Logo da Vinícola Agnello">
        <nav>
            <ul class="nav-links">
                <li><a href="../../index.html">Início</a></li>
                <li><a href="catalogo.html">Catalogo</a></li>
                <li><a href="historia.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="compra">
        <div class="caixa">
            <img src="../assets/imgs/caixa.png" alt="Checklist" width="132" height="200">
            <h1>Reserve seu Vinho</h1>
        </div>
        <p id="escolha">Escolha o vinho que deseja reservar!</p>
        <hr>
        <section class="formulario">
            <h2>Formulário de Reserva</h2>
            <form>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required><br><br>

                <label for="vinho">Selecione o Vinho dos Catalogo:</label>
                <select name="vinho" id="vinho">
                    <option value="">Selecione</option>
                    <option value="papafigos">Papa Figos</option>
                    <option value="expedicion">Expedicion</option>
                    <option value="Portada">Portada</option>
                </select>
                <br><br>

                <input id="reservar" type="submit" value="Reservar">
        </section>
        <footer>

        </footer>
    </main>
    <script src="../js/script.js"></script>
</body>

</html>
