<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinícola Agnello</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/efeitos.css">
    <link rel="shortcut icon" href="src/assets/imgs/favicon.ico" type="image/x-icon">
</head>

<body>
    <header class="header-login">
        <img src="src/assets/imgs/android-chrome-512x512.png" alt="Logo da Vinícola Agnello">
    </header>

    <main>
        <div class="login-container">
            
            <form action="src/pages/inicio.html" method="GET">
                <h1 >Realize seu login</h1>
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>

                <input id="login-btn" type="submit" value="Login">
            </form>
        </div>
    </main>

    <footer>

    </footer>
</body>

</html>
